<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数智合规 · DataCompliance AI</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app" id="app">
    <!-- ─────────── 左侧任务边栏 ─────────── -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">DC</div>
        <div class="brand-text">
          <div class="brand-title">数智合规</div>
          <div class="brand-sub">数据出境合规 · v2</div>
        </div>
      </div>

      <button class="btn btn-primary btn-block" id="btn-new-task">
        <span class="ico">＋</span> 新建任务
      </button>

      <div class="task-list-header">
        <span>历史任务</span>
        <span class="task-count" id="task-count">0</span>
      </div>
      <ol class="task-list" id="task-list"></ol>

      <div class="sidebar-footer">
        <div class="user-card" id="user-card">
          <div class="user-avatar" id="user-avatar">?</div>
          <div class="user-info">
            <div class="user-name" id="user-name">未登录</div>
            <div class="user-provider" id="user-provider">—</div>
          </div>
          <button class="btn btn-ghost btn-icon" id="btn-user-menu" title="账户菜单">⋯</button>
        </div>
        <div class="user-menu hidden" id="user-menu">
          <button class="menu-item" id="btn-github-login">使用 GitHub 登录</button>
          <button class="menu-item" id="btn-logout">退出登录</button>
        </div>
      </div>
    </aside>

    <!-- ─────────── 右侧主区：聊天 ─────────── -->
    <main class="chat-pane">
      <header class="chat-header">
        <!-- 模式切换：新建对话时决定走哪条业务路径 -->
        <nav class="mode-tabs" id="mode-tabs" role="tablist" aria-label="业务模式">
          <button class="mode-tab active" role="tab" data-mode="qa" aria-selected="true">
            <span class="mode-ico">💬</span>
            <span class="mode-name">知识问答</span>
            <span class="mode-desc">日常合规查询</span>
          </button>
          <button class="mode-tab" role="tab" data-mode="research" aria-selected="false">
            <span class="mode-ico">🔬</span>
            <span class="mode-name">深度研究</span>
            <span class="mode-desc">长报告 · 多轮检索</span>
          </button>
          <button class="mode-tab" role="tab" data-mode="profile" aria-selected="false">
            <span class="mode-ico">📊</span>
            <span class="mode-name">风险画像</span>
            <span class="mode-desc">命题输入 · 接口预留</span>
          </button>
        </nav>
        <div class="chat-toolbar">
          <div class="chat-title-wrap">
            <span class="chat-title" id="chat-title">新对话</span>
            <span class="mode-badge" id="chat-mode-badge" hidden></span>
          </div>
          <div class="chat-actions">
            <span class="status-dot" id="status-dot" data-state="unknown"></span>
            <span class="status-text" id="status-text">检查中…</span>
          </div>
        </div>
      </header>

      <section class="messages" id="messages">
        <!-- 空状态：欢迎卡 -->
        <div class="welcome" id="welcome">
          <h1>欢迎使用数智合规</h1>
          <p>面向数据出境法规的对话式合规助手。Agent 会自主调用工具检索法条、研判证据并给出可追溯的回答。</p>
          <div class="suggest-grid">
            <button class="suggest-card" data-q="个人信息出境的三种合规路径分别是什么？">
              <div class="suggest-icon">📜</div>
              <div class="suggest-text">个人信息出境的三种合规路径分别是什么？</div>
            </button>
            <button class="suggest-card" data-q="什么情况下必须申报数据出境安全评估？">
              <div class="suggest-icon">🔍</div>
              <div class="suggest-text">什么情况下必须申报数据出境安全评估？</div>
            </button>
            <button class="suggest-card" data-q="标准合同备案需要准备哪些材料？">
              <div class="suggest-icon">📝</div>
              <div class="suggest-text">标准合同备案需要准备哪些材料？</div>
            </button>
            <button class="suggest-card" data-q="重要数据如何识别？依据是什么？">
              <div class="suggest-icon">⚖️</div>
              <div class="suggest-text">重要数据如何识别？依据是什么？</div>
            </button>
          </div>
        </div>
      </section>

      <footer class="composer">
        <form id="composer-form" autocomplete="off">
          <textarea
            id="composer-input"
            rows="1"
            placeholder="问点合规问题…  (Enter 发送，Shift+Enter 换行)"
          ></textarea>
          <button type="submit" class="btn btn-primary btn-send" id="btn-send">
            发送
          </button>
        </form>
        <div class="composer-hint">
          答案基于法规检索 + 工具调用，可能仍有误，请以官方文本为准。
        </div>
      </footer>
    </main>
  </div>

  <!-- 第三方：Markdown 渲染器（已在仓库中，无构建依赖） -->
  <script src="/static/marked.min.js"></script>
  <!-- 应用入口（ES module，自动按 import 链路加载其他模块） -->
  <script type="module" src="/static/app.js"></script>
</body>
</html>
