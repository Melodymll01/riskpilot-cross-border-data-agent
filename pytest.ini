[pytest]
testpaths = tests
python_files = test_*.py smoke_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --tb=short
markers =
    unit: pure-function tests with no I/O
    integration: tests touching real sqlite/chroma but with fake LLM/OAuth
    e2e: FastAPI TestClient end-to-end with all fakes
    slow: tests that may take >1s
filterwarnings =
    ignore::DeprecationWarning:pydantic.*
    ignore::DeprecationWarning:google.protobuf.*
