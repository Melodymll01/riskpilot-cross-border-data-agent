services:
  app:
    init: true
    build: .
    image: riskpilot-chat:latest
    restart: unless-stopped
    expose:
      - "8001"
    user: "${RISKPILOT_UID:-1000}:${RISKPILOT_GID:-1000}"
    env_file:
      - path: .env
        required: true
    environment:
      SQLITE_DB_PATH: /app/data/rag.sqlite3
      CHROMA_PERSIST_DIR: /app/data/chroma_db
      OBJECT_STORE_DIR: /app/data/objects
      UPLOAD_DIR: /app/data/uploads
      INTERNAL_SERVICE_REQUIRED: "true"
      INTERNAL_SERVICE_KEY_FILE: /app/data/internal-service.key
      RATE_LIMIT_ENABLED: "false"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
  gateway:
    init: true
    build:
      context: .
      dockerfile: services/api-go/Dockerfile
    image: riskpilot-go:latest
    restart: unless-stopped
    user: "${RISKPILOT_UID:-1000}:${RISKPILOT_GID:-1000}"
    ports:
      - "${APP_PORT:-8765}:8000"
    env_file:
      - path: .env
        required: true
    environment:
      RISKPILOT_ROOT: /app
      GATEWAY_LISTEN: 0.0.0.0:8000
      PYTHON_SERVICE_URL: http://app:8001
      SQLITE_DB_PATH: /app/data/rag.sqlite3
      INTERNAL_SERVICE_KEY_FILE: /app/data/internal-service.key
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      app:
        condition: service_healthy
