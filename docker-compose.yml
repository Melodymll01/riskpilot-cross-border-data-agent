services:
  app:
    init: true
    build:
      context: .
      dockerfile: Dockerfile
    image: riskpilot-rag:latest
    restart: unless-stopped
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "${APP_PORT:-8001}:8001"
    env_file:
      - path: .env
        required: false
    environment:
      STORAGE_BACKEND: postgres
      VECTOR_BACKEND: pgvector
      TASK_BACKEND: celery
      DATABASE_URL: &database_url postgresql+psycopg://${POSTGRES_USER:-riskpilot}:${POSTGRES_PASSWORD:-riskpilot-local-only}@postgres:5432/${POSTGRES_DB:-riskpilot}
      REDIS_URL: &redis_url redis://redis:6379/0
      CELERY_BROKER_URL: *redis_url
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CELERY_QUEUE: ${CELERY_QUEUE:-riskpilot.documents}
      OBJECT_STORE_BACKEND: s3
      S3_ENDPOINT_URL: &s3_endpoint http://minio:9000
      S3_ACCESS_KEY_ID: &s3_access_key ${MINIO_ROOT_USER:-riskpilot}
      S3_SECRET_ACCESS_KEY: &s3_secret_key ${MINIO_ROOT_PASSWORD:-riskpilot-local-only-secret}
      S3_BUCKET: ${S3_BUCKET:-riskpilot}
      LLM_PROVIDER: ${COMPOSE_LLM_PROVIDER:-local}
      EMBED_PROVIDER: ${COMPOSE_EMBED_PROVIDER:-deterministic}
      EMBEDDING_DIMENSIONS: "2048"
      AGENT_PLANNER_BACKEND: ${COMPOSE_AGENT_PLANNER_BACKEND:-deterministic}
      FACT_PROPOSAL_BACKEND: ${COMPOSE_FACT_PROPOSAL_BACKEND:-safe_empty}
      ENABLE_RERANKER: "false"
      ENABLE_WEB_SEARCH: "false"
      WARMUP_RESEARCH_ON_STARTUP: "false"
      MEMORY_ENABLED: "false"
      JSON_LOGS_ENABLED: "true"
      PROMETHEUS_ENABLED: "true"
      DEMO_LOGIN_ENABLED: "true"
      DEMO_LOGIN_USER_ID: github:riskpilot-demo-admin
      ADMIN_USER_IDS: github:riskpilot-demo-admin
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - app-data:/app/data
      - app-logs:/app/logs
      - hf-cache:/app/.cache/huggingface
    mem_limit: ${APP_MEMORY_LIMIT:-2g}
    cpus: ${APP_CPU_LIMIT:-2.0}
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/v2/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  worker:
    init: true
    build:
      context: .
      dockerfile: Dockerfile
    image: riskpilot-rag:latest
    restart: unless-stopped
    command: >-
      celery -A infra.tasks.document_tasks:celery_app worker
      --loglevel=INFO
      --pool=prefork
      --concurrency=${CELERY_WORKER_CONCURRENCY:-2}
      --queues=${CELERY_QUEUE:-riskpilot.documents}
    env_file:
      - path: .env
        required: false
    environment:
      STORAGE_BACKEND: postgres
      VECTOR_BACKEND: pgvector
      TASK_BACKEND: celery
      DATABASE_URL: *database_url
      REDIS_URL: *redis_url
      CELERY_BROKER_URL: *redis_url
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CELERY_QUEUE: ${CELERY_QUEUE:-riskpilot.documents}
      OBJECT_STORE_BACKEND: s3
      S3_ENDPOINT_URL: *s3_endpoint
      S3_ACCESS_KEY_ID: *s3_access_key
      S3_SECRET_ACCESS_KEY: *s3_secret_key
      S3_BUCKET: ${S3_BUCKET:-riskpilot}
      EMBED_PROVIDER: ${COMPOSE_EMBED_PROVIDER:-deterministic}
      EMBEDDING_DIMENSIONS: "2048"
      LLM_PROVIDER: ${COMPOSE_LLM_PROVIDER:-local}
      PROMETHEUS_ENABLED: "true"
      PROMETHEUS_WORKER_PORT: "9101"
      PROMETHEUS_MULTIPROC_DIR: /tmp/riskpilot-prometheus
    ports:
      - "${PROMETHEUS_WORKER_PORT:-9101}:9101"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - app-data:/app/data
      - app-logs:/app/logs
      - hf-cache:/app/.cache/huggingface
    mem_limit: ${WORKER_MEMORY_LIMIT:-3g}
    cpus: ${WORKER_CPU_LIMIT:-2.0}
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A infra.tasks.document_tasks:celery_app inspect ping --destination celery@$$HOSTNAME --timeout 5",
        ]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 20s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: riskpilot-rag:latest
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: *database_url
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    profiles: ["tools"]
    image: riskpilot-rag:latest
    command: ["python", "-m", "scripts.seed_demo"]
    env_file:
      - path: .env
        required: false
    environment:
      STORAGE_BACKEND: postgres
      VECTOR_BACKEND: pgvector
      TASK_BACKEND: celery
      DATABASE_URL: *database_url
      REDIS_URL: *redis_url
      CELERY_BROKER_URL: *redis_url
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CELERY_QUEUE: ${CELERY_QUEUE:-riskpilot.documents}
      OBJECT_STORE_BACKEND: s3
      S3_ENDPOINT_URL: *s3_endpoint
      S3_ACCESS_KEY_ID: *s3_access_key
      S3_SECRET_ACCESS_KEY: *s3_secret_key
      S3_BUCKET: ${S3_BUCKET:-riskpilot}
      LLM_PROVIDER: local
      EMBED_PROVIDER: deterministic
      EMBEDDING_DIMENSIONS: "2048"
      AGENT_PLANNER_BACKEND: deterministic
      FACT_PROPOSAL_BACKEND: safe_empty
      ENABLE_RERANKER: "false"
      ENABLE_WEB_SEARCH: "false"
      WARMUP_RESEARCH_ON_STARTUP: "false"
      MEMORY_ENABLED: "false"
      PROMETHEUS_ENABLED: "false"
    depends_on:
      app:
        condition: service_healthy
      worker:
        condition: service_healthy
    volumes:
      - app-data:/app/data
      - app-logs:/app/logs
    restart: "no"

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-riskpilot}
      POSTGRES_USER: ${POSTGRES_USER:-riskpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-riskpilot-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-riskpilot} -d ${POSTGRES_DB:-riskpilot}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-1g}
    cpus: ${POSTGRES_CPU_LIMIT:-1.0}

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: ${REDIS_MEMORY_LIMIT:-512m}
    cpus: ${REDIS_CPU_LIMIT:-0.5}

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-riskpilot}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-riskpilot-local-only-secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: ${MINIO_MEMORY_LIMIT:-1g}
    cpus: ${MINIO_CPU_LIMIT:-1.0}

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000
      ${MINIO_ROOT_USER:-riskpilot}
      ${MINIO_ROOT_PASSWORD:-riskpilot-local-only-secret} &&
      mc mb --ignore-existing local/${S3_BUCKET:-riskpilot}
      "
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      app:
        condition: service_healthy
      worker:
        condition: service_healthy
    mem_limit: ${PROMETHEUS_MEMORY_LIMIT:-512m}
    cpus: ${PROMETHEUS_CPU_LIMIT:-0.5}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  app-data:
  app-logs:
  hf-cache:
  postgres-data:
  redis-data:
  minio-data:
  prometheus-data:
