name: CI

# CI 策略：
# - 所有 Python 文件进入 Ruff 与 format 门禁；
# - domain/app/infra 进入 mypy 门禁；
# - pytest 默认 local/Fake profile，零密钥、零网络、零模型下载；
# - 显式 live 评测只允许人工运行，不进入普通 PR CI。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Quality (ruff · format · mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy
        run: mypy domain app infra

  test:
    name: Tests (pytest · offline fakes)
    runs-on: ubuntu-latest
    env:
      # tests/conftest.py 默认 local profile；具体调用全部注入 Fake。
      ENABLE_RERANKER: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      # Auth：使用假的 OAuth 凭据让 AuthService 能装配，但不会真正调 GitHub
      AUTH_PROVIDERS_ENABLED: github,anonymous
      GITHUB_CLIENT_ID: fake_ci_client_id
      GITHUB_CLIENT_SECRET: fake_ci_client_secret
      JWT_SECRET: ci-test-jwt-secret-do-not-use-in-prod-32chars-min
      # admin baseline：留空 → 测试里要 admin 的用例自己 monkeypatch
      ADMIN_USER_IDS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies (with dev)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run pytest
        run: pytest -q
      - name: Run offline Agent trajectory evaluation
        run: python -m evaluations.agent_runs.run --no-write

  postgres:
    name: PostgreSQL (migration · repository contracts)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: riskpilot_test
          POSTGRES_USER: riskpilot
          POSTGRES_PASSWORD: riskpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U riskpilot -d riskpilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://riskpilot:riskpilot@127.0.0.1:5432/riskpilot_test
      TEST_POSTGRES_URL: postgresql+psycopg://riskpilot:riskpilot@127.0.0.1:5432/riskpilot_test
      STORAGE_BACKEND: postgres
      VECTOR_BACKEND: pgvector
      EMBEDDING_DIMENSIONS: "2048"
      LLM_PROVIDER: local
      EMBED_PROVIDER: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Alembic upgrade
        run: alembic upgrade head
      - name: Alembic schema drift check
        run: alembic check
      - name: PostgreSQL migration schema contract
        run: pytest -q tests/infra/test_alembic_migrations.py
      - name: PostgreSQL repository contracts
        run: pytest -q tests/infra/test_sqlalchemy_storage.py
