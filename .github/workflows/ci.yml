name: CI

# CI 策略：
# - test job：完整离线 pytest（仅排除真实 LLM 评测与重 IO smoke），强制必须绿；
# - lint job：覆盖 DDD 核心层、V3 API、QA/Workflow 适配器和 Evidence QA 评测器；
# - `run_verifier.py --live` 会产生模型费用，只允许人工按需执行，不进入 PR CI；
# - 遗留 retrieval / processing / ingestion 暂不纳入 Ruff 强门禁。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint (ruff · scoped)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install ruff
        run: pip install "ruff>=0.6.0"
      - name: ruff check (scoped to refactored layers)
        run: |
          ruff check \
            domain app \
            infra/auth infra/kb infra/risk_profile infra/audit infra/qa infra/workflows \
            api/v2 api/v3 \
            evaluations/evidence_qa evaluations/memory_extraction \
            config.py main.py \
            tests/api tests/app tests/domain tests/infra tests/fakes tests/evaluations
      # NOTE: ruff format --check 暂未启用 —— scoped 路径下仍有 33 个文件待
      # reformat，留待独立 Step 单独做一次性 cleanup commit，避免污染 CI 复活
      # 这一步的 diff（参考 ruff format --check . 输出）

  test:
    name: Tests (pytest · offline fakes)
    runs-on: ubuntu-latest
    env:
      # 关闭一切真实外呼，全部走 Fake / mock
      OPENAI_API_KEY: sk-test-fake
      OPENAI_API_BASE: http://127.0.0.1:9/v1
      CHAT_API_KEY: sk-test-fake
      CHAT_API_BASE: http://127.0.0.1:9/v1
      LLM_PROVIDER: api
      RISK_EVIDENCE_PROVIDER: mock
      ENABLE_RERANKER: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      # Auth：使用假的 OAuth 凭据让 AuthService 能装配，但不会真正调 GitHub
      AUTH_PROVIDERS_ENABLED: github,anonymous
      GITHUB_CLIENT_ID: fake_ci_client_id
      GITHUB_CLIENT_SECRET: fake_ci_client_secret
      JWT_SECRET: ci-test-jwt-secret-do-not-use-in-prod-32chars-min
      # admin baseline：留空 → 测试里要 admin 的用例自己 monkeypatch
      ADMIN_USER_IDS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies (with dev)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run pytest
        # eval_ood.py 需要真实 LLM；smoke_bm25_rrf.py 是重 IO 烟雾脚本，本地手动跑。
        # 其余测试必须全 Fake、零外呼，不允许按具体测试名 deselect。
        run: |
          pytest -q \
            --ignore=tests/eval_ood.py \
            --ignore=tests/smoke_bm25_rrf.py
