name: CI

# CI 策略：
# - 所有 Python 文件进入 Ruff 与 format 门禁；
# - services/agent-runtime/domain|app|infra 进入 mypy 门禁；
# - pytest 默认 local/Fake profile，零密钥、零网络、零模型下载；
# - 显式 live 评测只允许人工运行，不进入普通 PR CI。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  PYTHONPATH: ${{ github.workspace }}/services/agent-runtime
  PYTHONSAFEPATH: "1"

jobs:
  go:
    name: Go (vet · race tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: services/control-plane/go.sum
      - name: Go format
        working-directory: services/control-plane
        run: test -z "$(gofmt -l cmd internal)"
      - name: Go vet and tests
        working-directory: services/control-plane
        run: |
          go vet ./...
          go test -race ./...
  quality:
    name: Quality (ruff · format · mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/agent-runtime/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/agent-runtime/requirements-dev.txt
      - name: Ruff check
        run: python -m ruff check --config services/agent-runtime/pyproject.toml services/agent-runtime scripts
      - name: Ruff format check
        run: python -m ruff format --check --config services/agent-runtime/pyproject.toml services/agent-runtime scripts
      - name: Mypy
        run: >-
          python -m mypy --config-file services/agent-runtime/pyproject.toml
          services/agent-runtime/domain services/agent-runtime/app services/agent-runtime/infra
          services/agent-runtime/observability_context.py

  test:
    name: Tests (pytest · offline fakes)
    runs-on: ubuntu-latest
    env:
      ENABLE_RERANKER: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: services/control-plane/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/agent-runtime/requirements-dev.txt
      - name: Install dependencies (with dev)
        run: |
          python -m pip install --upgrade pip
          pip install -r services/agent-runtime/requirements-dev.txt
      - name: Run pytest
        run: python -m pytest -c services/agent-runtime/pytest.ini services/agent-runtime/tests -q
      - name: Run offline claim-citation evaluation
        run: python -m evaluations.evidence_qa.run --oracle-self-check --no-write
