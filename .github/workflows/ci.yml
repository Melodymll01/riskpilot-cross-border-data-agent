name: CI

# 暂时禁用：项目尚在重构阶段（ruff 红字未清、Python 版本与依赖未对齐）。
# 仅保留 workflow_dispatch（GitHub UI 手动触发），不再随 push/PR 自动运行。
# 等所有 step 完成、本地 ruff/mypy/pytest 全绿后，恢复 push + pull_request 触发即可。
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  type-check:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: mypy domain app infra/auth || true   # lenient until those layers exist
        continue-on-error: true

  test:
    name: Tests (offline)
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      OPENAI_API_KEY: sk-test-fake
      LLM_PROVIDER: api
      RISK_EVIDENCE_PROVIDER: mock
      ENABLE_RERANKER: "false"
      AUTH_PROVIDERS_ENABLED: github,anonymous
      GITHUB_CLIENT_ID: fake_id
      GITHUB_CLIENT_SECRET: fake_secret
      JWT_SECRET: ci_test_secret_change_me
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -ra --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
